<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">LeadGenius: outreach that did the homework</title>
  <desc id="heroDesc">An AI research assistant that reads every prospect's website, finds a real business problem, and writes the email a thoughtful human would write.</desc>
  <defs>
    <radialGradient id="glow" cx="16%" cy="8%" r="80%">
      <stop offset="0" stop-color="#5a3f16" stop-opacity=".85"/>
      <stop offset=".5" stop-color="#241a0d" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0c0a07" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="92%" cy="100%" r="55%">
      <stop offset="0" stop-color="#3b2a12" stop-opacity=".55"/>
      <stop offset="1" stop-color="#0c0a07" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d493"/>
      <stop offset="1" stop-color="#c28c42"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#c28c42"/>
      <stop offset=".45" stop-color="#f6dca2"/>
      <stop offset=".55" stop-color="#f6dca2"/>
      <stop offset="1" stop-color="#c28c42"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#f3e9d7" opacity=".05"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="460" rx="28"/></clipPath>
    <clipPath id="card"><rect x="700" y="60" width="436" height="340" rx="18"/></clipPath>
  </defs>
  <style>
    .serif{font-family:Georgia,'Times New Roman',serif}
    .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .pulse{animation:pulse 1.6s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .tick{opacity:0}
    .t1{animation:t1 12s infinite}
    .t2{animation:t2 12s infinite}
    .t3{animation:t3 12s infinite}
    .t4{animation:t4 12s infinite}
    @keyframes t1{0%{opacity:0;transform:translateY(8px)}2%,16%{opacity:1;transform:translateY(0)}18%,100%{opacity:0;transform:translateY(-8px)}}
    @keyframes t2{0%,18%{opacity:0;transform:translateY(8px)}20%,33%{opacity:1;transform:translateY(0)}35%,100%{opacity:0;transform:translateY(-8px)}}
    @keyframes t3{0%,35%{opacity:0;transform:translateY(8px)}37%,64%{opacity:1;transform:translateY(0)}66%,100%{opacity:0;transform:translateY(-8px)}}
    @keyframes t4{0%,66%{opacity:0;transform:translateY(8px)}68%,95%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(-8px)}}
    .body{animation:bodyfade 12s infinite}
    @keyframes bodyfade{0%,94%{opacity:1}98%,100%{opacity:0}}
    .w1{animation:w1 12s infinite}
    .w2{animation:w2 12s infinite}
    .w3{animation:w3 12s infinite}
    .w4{animation:w4 12s infinite}
    .w5{animation:w5 12s infinite}
    .w6{animation:w6 12s infinite}
    @keyframes w1{0%,26%{transform:translateX(0)}32%,99%{transform:translateX(440px)}100%{transform:translateX(0)}}
    @keyframes w2{0%,32%{transform:translateX(0)}37%,99%{transform:translateX(440px)}100%{transform:translateX(0)}}
    @keyframes w3{0%,40%{transform:translateX(0)}46%,99%{transform:translateX(440px)}100%{transform:translateX(0)}}
    @keyframes w4{0%,46%{transform:translateX(0)}52%,99%{transform:translateX(440px)}100%{transform:translateX(0)}}
    @keyframes w5{0%,52%{transform:translateX(0)}58%,99%{transform:translateX(440px)}100%{transform:translateX(0)}}
    @keyframes w6{0%,60%{transform:translateX(0)}66%,99%{transform:translateX(440px)}100%{transform:translateX(0)}}
    .c1,.c2,.c3,.c4,.c5,.c6{opacity:0}
    .c1{animation:c1 12s infinite}.c2{animation:c2 12s infinite}.c3{animation:c3 12s infinite}
    .c4{animation:c4 12s infinite}.c5{animation:c5 12s infinite}.c6{animation:c6 12s infinite}
    @keyframes c1{0%,25.5%{opacity:0}26%,100%{opacity:1}}
    @keyframes c2{0%,31.5%{opacity:0}32%,100%{opacity:1}}
    @keyframes c3{0%,39.5%{opacity:0}40%,100%{opacity:1}}
    @keyframes c4{0%,45.5%{opacity:0}46%,100%{opacity:1}}
    @keyframes c5{0%,51.5%{opacity:0}52%,100%{opacity:1}}
    @keyframes c6{0%,59.5%{opacity:0}60%,100%{opacity:1}}
    .gauge{stroke-dasharray:188.5;stroke-dashoffset:188.5;animation:gauge 12s infinite}
    @keyframes gauge{0%,67%{stroke-dashoffset:188.5}78%,99%{stroke-dashoffset:13.2}100%{stroke-dashoffset:188.5}}
    .score{opacity:0;animation:score 12s infinite}
    @keyframes score{0%,75%{opacity:0}79%,99%{opacity:1}100%{opacity:0}}
    .chip1{opacity:0;animation:chip1 12s infinite}
    .chip2{opacity:0;animation:chip2 12s infinite}
    .ready{opacity:0;animation:ready 12s infinite}
    @keyframes chip1{0%,79%{opacity:0;transform:translateY(6px)}82%,99%{opacity:1;transform:translateY(0)}100%{opacity:0}}
    @keyframes chip2{0%,81%{opacity:0;transform:translateY(6px)}84%,99%{opacity:1;transform:translateY(0)}100%{opacity:0}}
    @keyframes ready{0%,85%{opacity:0}88%,99%{opacity:1}100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){
      .t1,.t2,.t3,.w1,.w2,.w3,.w4,.w5,.w6,.body,.pulse,.chip1,.chip2,.ready,.score,.gauge{animation:none}
      .t4,.chip1,.chip2,.ready,.score{opacity:1}
      .w1,.w2,.w3,.w4,.w5,.w6{transform:translateX(440px)}
      .gauge{stroke-dashoffset:13.2}
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="460" fill="#0c0a07"/>
    <rect width="1200" height="460" fill="url(#glow)"/>
    <rect width="1200" height="460" fill="url(#glow2)"/>
    <rect width="1200" height="460" fill="url(#dots)"/>
    <rect x=".5" y=".5" width="1199" height="459" rx="28" fill="none" stroke="#3a2d18" stroke-opacity=".7"/>

    <rect x="64" y="52" width="52" height="52" rx="13" fill="url(#gold)"/>
    <text x="90" y="88" text-anchor="middle" class="serif" font-size="27" font-weight="700" fill="#2a1c08">L</text>
    <text x="132" y="76" class="serif" font-size="26" font-weight="700" fill="#f3e9d7">LeadGenius</text>
    <text x="133" y="97" class="sans" font-size="11" letter-spacing="3.2" fill="#b9924f">RESEARCH &amp; OUTREACH</text>

    <text x="62" y="196" class="serif" font-size="62" fill="#f5ecdc">Outreach that did</text>
    <text x="62" y="266" class="serif" font-size="62" fill="url(#shimmer)">the homework.</text>

    <text x="64" y="316" class="sans" font-size="19" fill="#c2b6a2">AI that reads every prospect's website, finds a real</text>
    <text x="64" y="343" class="sans" font-size="19" fill="#c2b6a2">problem, and writes the email a thoughtful human would.</text>

    <rect x="64" y="376" width="420" height="42" rx="21" fill="#15110b" stroke="#3a2e1d"/>
    <circle cx="88" cy="397" r="5" fill="#7fc79a" class="pulse"/>
    <g class="mono" font-size="13.5" fill="#e6d7bd">
      <text x="104" y="402" class="tick t1">Crawling dundermifflin.example (6 pages)</text>
      <text x="104" y="402" class="tick t2">Found 6 facts, each with a source link</text>
      <text x="104" y="402" class="tick t3">Writing a 5-step email sequence...</text>
      <text x="104" y="402" class="tick t4">Scored 93/100. Ready for your review</text>
    </g>

    <rect x="708" y="72" width="436" height="340" rx="18" fill="#000" opacity=".35"/>
    <rect x="700" y="60" width="436" height="340" rx="18" fill="#15110b" stroke="#3d301c"/>
    <text x="728" y="98" class="mono" font-size="11" letter-spacing="2" fill="#a8916a">EMAIL 1 · DUNDER MIFFLIN PAPER</text>
    <text x="728" y="120" class="sans" font-size="12.5" fill="#7d7160">To: Michael Scott, Regional Manager</text>

    <g transform="translate(1086 104) rotate(-90)">
      <circle r="30" fill="none" stroke="#2a2318" stroke-width="6"/>
      <circle r="30" fill="none" stroke="#7fc79a" stroke-width="6" stroke-linecap="round" class="gauge"/>
    </g>
    <text x="1086" y="111" text-anchor="middle" class="serif score" font-size="21" font-weight="700" fill="#f3e9d7">93</text>

    <g class="body" clip-path="url(#card)">
      <g class="serif" font-size="16.5" fill="#efe4d0">
        <text x="728" y="164">I was going to call about your ops team,</text>
        <text x="728" y="188">but figured I'd write first.</text>
        <text x="728" y="224">Quotes still need a sales call, and you're</text>
        <text x="728" y="248">hiring 3 coordinators. I'd guess slow</text>
        <text x="728" y="272">quotes quietly cost a few deals a week.</text>
        <text x="728" y="308">Mind if I send over a short example?</text>
      </g>
      <g fill="#15110b">
        <g class="w1"><rect x="722" y="148" width="440" height="24"/><rect x="722" y="149" width="2" height="20" fill="#e2b866" class="c1"/></g>
        <g class="w2"><rect x="722" y="172" width="440" height="24"/><rect x="722" y="173" width="2" height="20" fill="#e2b866" class="c2"/></g>
        <g class="w3"><rect x="722" y="208" width="440" height="24"/><rect x="722" y="209" width="2" height="20" fill="#e2b866" class="c3"/></g>
        <g class="w4"><rect x="722" y="232" width="440" height="24"/><rect x="722" y="233" width="2" height="20" fill="#e2b866" class="c4"/></g>
        <g class="w5"><rect x="722" y="256" width="440" height="24"/><rect x="722" y="257" width="2" height="20" fill="#e2b866" class="c5"/></g>
        <g class="w6"><rect x="722" y="292" width="440" height="24"/><rect x="722" y="293" width="2" height="20" fill="#e2b866" class="c6"/></g>
      </g>
      <g class="chip1">
        <rect x="728" y="336" width="138" height="28" rx="14" fill="#2a2113" stroke="#5b4624"/>
        <text x="797" y="355" text-anchor="middle" class="mono" font-size="12" fill="#e2b866">source: /careers</text>
      </g>
      <g class="chip2">
        <rect x="876" y="336" width="138" height="28" rx="14" fill="#2a2113" stroke="#5b4624"/>
        <text x="945" y="355" text-anchor="middle" class="mono" font-size="12" fill="#e2b866">source: /pricing</text>
      </g>
      <g class="ready">
        <rect x="1024" y="336" width="88" height="28" rx="14" fill="#15301f" stroke="#2f6a45"/>
        <text x="1068" y="355" text-anchor="middle" class="sans" font-size="12.5" font-weight="600" fill="#8fdcaa">✓ ready</text>
      </g>
    </g>
  </g>
</svg>
